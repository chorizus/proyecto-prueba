<div class="form-container">
  <div class="form-group">
    <label>Name</label>
    <input class="input-field" type="text" placeholder="Introduce tu nombre">
  </div>

  <div class="form-group">
    <label>Surname</label>
    <input class="input-field" type="text" placeholder="Introduce tu apellido">
  </div>

  <div class="form-group">
    <label>Email</label>
    <input class="input-field" type="email" placeholder="Introduce tu email">
  </div>

  <div class="form-group message">
    <label>Message</label>
    <div class="input-field">
      <span>Value</span>
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.52303 0.353546L0.353546 6.52303M6.98067 3.89592L3.89593 6.98066" stroke="#B3B3B3"/>
      </svg>
    </div>
  </div>

  <div class="form-actions">
    <button class="submit-button">Submit</button>
  </div>
</div>
